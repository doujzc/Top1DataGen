[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "top1-data-gen"
version = "0.1.0"
description = "Controlled, independently audited data generation for Top1 intent routers"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = []

[project.scripts]
top1-generate = "top1_data_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["top1_data_gen*"]
